name: Sync Upstream & Build APK

# 每天定时检查上游 Johnny520/WeKit (原名 Johnny520/wcx) 是否更新:
#   有更新 -> 默认只报告, 不自动合并 (见下方 auto_merge 说明)
#   手动触发 (workflow_dispatch) 时始终构建, 并可用 force_release 强制发布 Release
#
# 为什么默认不自动合并:
#   上游在 2026-09 把仓库整体重构并改名 WeKit (包名 com.Johnny.wcx -> dev.ujhhgtg.wekit,
#   新增 Rust 侧 wekit-zygisk/xtask), 新仓库与本地历史已无共同祖先 (unrelated histories),
#   强行 git merge 必然导致上千文件冲突并让本工作流天天失败。
#   因此这里只拉取上游做"有没有新东西"的检测, 由人工决定如何回移。

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00, 每天一次
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: '上游仓库 (owner/name)'
        default: 'Johnny520/WeKit'
        required: false
      upstream_branch:
        description: '上游分支'
        default: 'master'
        required: false
      auto_merge:
        description: '尝试自动合并上游 (上游已整包重构, 默认关闭)'
        type: boolean
        default: false
      force_release:
        description: '无上游更新时也强制构建并发布 Release'
        type: boolean
        default: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史: 合并上游需要共同祖先, build.gradle.kts 也要 git rev-parse
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${{ github.event.inputs.upstream_repo || 'Johnny520/WeKit' }}.git"
          git fetch upstream "${{ github.event.inputs.upstream_branch || 'master' }}"

      - name: Record upstream commit
        id: upstream
        run: |
          SHA=$(git rev-parse --short "upstream/${{ github.event.inputs.upstream_branch || 'master' }}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "## 上游最新提交: $SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Check upstream divergence
        id: merge
        run: |
          UP="upstream/${{ github.event.inputs.upstream_branch || 'master' }}"
          if git merge-base --is-ancestor "$UP" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游已全部包含在本仓库中。" >> "$GITHUB_STEP_SUMMARY"
          else
            BEHIND=$(git rev-list --count HEAD.."$UP" 2>/dev/null || echo "0")
            echo "## 上游有 $BEHIND 个新提交未合入" >> "$GITHUB_STEP_SUMMARY"
            echo "$BEHIND" >> "$GITHUB_STEP_SUMMARY"
            git log --oneline -20 "$UP" >> "$GITHUB_STEP_SUMMARY" || true
            if [ "${{ inputs.auto_merge }}" = "true" ]; then
              BASE=$(git rev-parse HEAD)
              if git merge --no-edit --allow-unrelated-histories "$UP"; then
                if [ "$(git rev-parse HEAD)" = "$BASE" ]; then
                  echo "changed=false" >> "$GITHUB_OUTPUT"
                else
                  echo "changed=true" >> "$GITHUB_OUTPUT"
                  git log --oneline "$BASE..HEAD" >> "$GITHUB_STEP_SUMMARY" || true
                fi
              else
                echo '## 合并冲突, 已回滚' >> "$GITHUB_STEP_SUMMARY"
                git diff --name-only --diff-filter=U >> "$GITHUB_STEP_SUMMARY" || true
                git merge --abort
                exit 1
              fi
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo 'auto_merge 未开启: 保持本仓库代码不变, 仅报告上游状态。' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Push merge result back to master
        # GITHUB_TOKEN 的 push 不会再次触发本工作流 (GitHub 设计如此), 无循环风险
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Set up JDK 21
        # 定时触发且上游无更新时跳过全部构建步骤, 节省 Actions 配额;
        # 手动触发始终构建
        if: steps.merge.outputs.changed == 'true' || github.event_name != 'schedule' || inputs.force_release == true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.merge.outputs.changed == 'true' || github.event_name != 'schedule' || inputs.force_release == true
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore (optional)
        env:
          WEKIT_KEYSTORE_BASE64: ${{ secrets.WEKIT_KEYSTORE_BASE64 }}
        if: env.WEKIT_KEYSTORE_BASE64 != '' && (steps.merge.outputs.changed == 'true' || github.event_name != 'schedule' || inputs.force_release == true)
        run: echo "$WEKIT_KEYSTORE_BASE64" | base64 -d > "$HOME/wcx-keystore.jks"

      - name: Build release APKs
        if: steps.merge.outputs.changed == 'true' || github.event_name != 'schedule' || inputs.force_release == true
        env:
          # 与下方 Publish 步骤的 tag 同源, 写入 APK 的 BuildConfig.RELEASE_TAG
          WCX_RELEASE_TAG: v260
        run: |
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifacts
        if: steps.merge.outputs.changed == 'true' || github.event_name != 'schedule' || inputs.force_release == true
        uses: actions/upload-artifact@v4
        with:
          name: wcx-apks-${{ github.run_id }}
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Publish APKs to Release
        # 上游有更新 (或手动强制) 时发布 Release, tag 固定 v259 (应用 versionCode),
        # 重复发布会更新既有 Release, 不会堆积重复项
        if: steps.merge.outputs.changed == 'true' || inputs.force_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v260
          name: v260
          body: |
            基于上游 Johnny520/WeKit (原名 wcx) 的仓库构建。

            本次重点:
            - 修复定时任务偶尔不发: 漏发补发窗口 15 分钟 -> 12 小时, 并用"当天是否已发"判重,
              进程被杀/闹钟被吞后重新打开微信仍会补发当天漏掉的任务
            - 闹钟 requestCode 不再用 id.hashCode(), 杜绝哈希相撞导致任务静默失效
            - 定时任务存储读写加锁, 避免并发触发时整表覆盖造成状态回退
            - 多段消息逐段独立发送 + 失败重试, 第一段失败不再连累后面的文本段
            - 新增 30 秒守护轮询, 兜底进程内定时器丢失 / 深度休眠错过的到点任务

            包含本仓库全部改动 (定时发送 777026 / 取消定时发送 777027 / 自定义通知铃声 等)。

            附件 4 个 APK: standard/legacy × arm64-v8a/armeabi-v7a,
            正式签名, 可直接覆盖安装。推荐 app-standard-arm64-v8a-release.apk。
          files: app/build/outputs/apk/*/release/*.apk
          fail_on_unmatched_files: true
