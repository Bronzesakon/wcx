name: build

# 推 master / 打 tag / 手动触发 → 云端构建 4 个 APK → 发布下载。
# 发布策略沿用 sevnX / Mimo 的 CI 模式：
#   - master 推送 → 覆盖发布固定 tag `latest` 的滚动 pre-release
#     （资产 --clobber 覆盖、tag 强制移动、标题/说明刷新，页面与二进制始终一致）
#   - v* tag → 该 tag 的正式 release
# 签名复用 zcode-remote（android-shell）的 keystore：材料经 4 个 WEKIT_* Secrets
# 注入，与 E:\Zcode_harmony\android-shell 的 ANDROID_* 流同源同key。
# 密钥缺失不阻断：回退 debug 签名并给出 warning（与 android-shell 一致）。

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      full_build:
        description: '构建全部 4 个 variant（默认只出 standard × arm64-v8a）'
        type: boolean
        default: false

# 同一 ref 有新提交时取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 发布 release 资产

jobs:
  apk:
    name: Build & publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # build.gradle.kts 的 versionCode 用 git rev-list --count HEAD
          fetch-depth: 0

      - name: Record timestamps (UTC+8)
        shell: bash
        run: |
          cst() {
            local epoch
            if [ -n "$1" ]; then epoch=$(date -u -d "$1" +%s); else epoch=$(date -u +%s); fi
            date -u -d "@$((epoch + 28800))" "$2"
          }
          build_start=$(cst '' '+%Y-%m-%d %H:%M:%S')
          push_time=$(cst "$(git log -1 --pretty=%cI)" '+%Y-%m-%d %H:%M:%S')
          {
            echo "BUILD_START_UTC8=$build_start"
            echo "PUSH_TIME_UTC8=$push_time"
          } >> "$GITHUB_ENV"
          echo "build start $build_start (UTC+8) - commit $push_time (UTC+8)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle 缓存由 setup-gradle 自带；这里只补 wrapper 下载缓存已在其中，
      # 不额外缓存 build/ —— APK 产物本身不缓存。

      - name: Restore release keystore
        env:
          WEKIT_KEYSTORE_BASE64: ${{ secrets.WEKIT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${WEKIT_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$WEKIT_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$HOME/wcx-keystore.jks"
            if ! [ -s "$HOME/wcx-keystore.jks" ]; then
              echo "::error::WEKIT_KEYSTORE_BASE64 解码后为空，请检查 secret 取值"
              exit 1
            fi
            echo "SIGNING=release" >> "$GITHUB_ENV"
            echo "Release keystore restored (zcode-remote shared key)."
          else
            echo "SIGNING=debug" >> "$GITHUB_ENV"
            echo "::warning title=Debug-signed build::WEKIT_KEYSTORE_BASE64 未配置，APK 将使用 debug 签名，无法覆盖安装正式签名包（需卸载重装）。"
          fi

      - name: Resolve build task
        # 默认只编 standard × arm64-v8a（日常出包）；手动勾选 full_build 时编全部 4 个。
        # AGP 的 variant 任务名（arm64-v8a -> Arm64V8a）不硬猜：从 tasks 列表里解析，
        # 解析失败再回退到最可能的写法，失败会在构建步骤显式报错。
        env:
          FULL_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build == true }}
        run: |
          set -euo pipefail
          if [ "$FULL_BUILD" = "true" ]; then
            echo "BUILD_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK_DIR_PATTERN=app/build/outputs/apk/*/release" >> "$GITHUB_ENV"
          else
            # 注意：grep 无匹配返回 1，在 pipefail + set -e 下会中止脚本，
            # 管道必须 || true，回退任务名才能生效
            TASK=$(./gradlew --no-daemon --console=plain :app:tasks --all \
              | grep -oE 'assembleStandard[A-Za-z0-9]*Release' | grep -iE 'arm64|v8a' | head -1 || true)
            TASK="${TASK:-assembleStandardArm64V8aRelease}"
            echo "BUILD_TASK=$TASK" >> "$GITHUB_ENV"
            echo "APK_DIR_PATTERN=app/build/outputs/apk/standard/arm64-v8a/release" >> "$GITHUB_ENV"
            echo "build task: $TASK"
          fi

      - name: Build release APKs
        env:
          # wcx 的 build.gradle.kts 签名解析优先读这 4 个环境变量
          WEKIT_KEYSTORE_FILE: ${{ env.SIGNING == 'release' && format('{0}/wcx-keystore.jks', env.HOME) || '' }}
          WEKIT_KEYSTORE_PASSWORD: ${{ secrets.WEKIT_KEYSTORE_PASSWORD }}
          WEKIT_KEY_ALIAS: ${{ secrets.WEKIT_KEY_ALIAS }}
          WEKIT_KEY_PASSWORD: ${{ secrets.WEKIT_KEY_PASSWORD }}
          # 写入 BuildConfig.RELEASE_TAG 供应用内更新判等
          WCX_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        run: ./gradlew --no-daemon --console=plain "$BUILD_TASK"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wcx-apks-${{ github.run_id }}
          path: ${{ env.APK_DIR_PATTERN }}/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify APK signatures
        if: env.SIGNING == 'release'
        run: |
          set -euo pipefail
          for apk in ${{ env.APK_DIR_PATTERN }}/*.apk; do
            echo "== $apk"
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$apk" | head -3
          done

      # 发布：PR 不发；tag → 正式 release；master 推送 → 滚动 pre-release `latest`。
      # `latest` 刻意不带 v 前缀，避免匹配本 workflow 的 `v*` 触发造成循环。
      - name: Publish release (rolling pre-release on master / release on tag)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(${{ env.APK_DIR_PATTERN }}/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "no APK was produced" >&2
            exit 1
          fi

          build_start="${BUILD_START_UTC8:-$(date -u -d "@$(( $(date -u +%s) + 28800 ))" '+%Y-%m-%d %H:%M:%S')}"
          push_time="${PUSH_TIME_UTC8:-$(date -u -d "@$(( $(git log -1 --pretty=%ct) + 28800 ))" '+%Y-%m-%d %H:%M:%S')}"
          notes="build start ${build_start} (UTC+8) - commit ${push_time} (UTC+8) - ${GITHUB_SHA:0:7} - signing: ${SIGNING}"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            title="WCX ${tag}"
            options=(--notes "$notes" --generate-notes)
            rolling=false
          else
            tag="latest"
            title="Latest build (master, ${build_start} UTC+8)"
            options=(--prerelease --notes "$notes")
            rolling=true
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete-asset "$tag" "$(gh release view "$tag" --json assets --jq '.assets[].name')" --yes 2>/dev/null || true
            gh release upload "$tag" "${apks[@]}" --clobber
            if [ "$rolling" = true ]; then
              # 换资产的同时移动 tag 并刷新标题/说明，使页面与本次二进制一致
              git push --force origin "HEAD:refs/tags/$tag"
              gh release edit "$tag" --title "$title" --notes "$notes"
            fi
          else
            gh release create "$tag" --title "$title" "${options[@]}" "${apks[@]}"
          fi
          gh release view "$tag" --json tagName,isPrerelease,assets \
            --jq '"published " + .tagName + " prerelease=" + (.isPrerelease|tostring) + " assets=" + ([.assets[].name]|join(","))'
